class Music{constructor(){this.ctx=null;this.timer=null;this.mode='';this.step=0}unlock(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A()}if(this.ctx?.state==='suspended')this.ctx.resume()}tone(f,d=.12,type='sine',g=.03,delay=0){if(!this.ctx)return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),v=this.ctx.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(this.ctx.destination);o.start(t);o.stop(t+d+.02)}noise(d=.06,g=.018,delay=0){if(!this.ctx)return;const sr=this.ctx.sampleRate,b=this.ctx.createBuffer(1,sr*d,sr);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=this.ctx.createBufferSource(),v=this.ctx.createGain();s.buffer=b;v.gain.value=g;s.connect(v).connect(this.ctx.destination);s.start(this.ctx.currentTime+delay)}sfx(k){if(!save.sfx)return;this.unlock();if(k==='tap'){this.tone(700,.07,'triangle',.045);this.tone(1040,.07,'triangle',.03,.03)}if(k==='perfect'){this.tone(880,.08,'triangle',.05);this.tone(1318,.09,'triangle',.04,.04)}if(k==='miss'){this.tone(150,.18,'sawtooth',.045);this.noise(.11,.025)}if(k==='boss'){this.tone(95,.42,'sawtooth',.055);this.noise(.18,.03,.06)}if(k==='clear'){[659,784,988,1318].forEach((f,i)=>this.tone(f,.14,'triangle',.045,i*.07))}if(k==='skill'){[523,659,880].forEach((f,i)=>this.tone(f,.1,'triangle',.035,i*.05))}}start(mode){this.unlock();if(!save.music||!this.ctx)return;if(this.mode===mode&&this.timer)return;this.stop();this.mode=mode;this.step=0;const cfg={stage1:{bpm:118,lead:[523,659,784,659,587,698,784,880],bass:[131,147,165,147],type:'triangle',drum:2},stage2:{bpm:142,lead:[392,523,659,784,659,523,698,880],bass:[98,123,110,147],type:'square',drum:1},stage3:{bpm:132,lead:[220,294,330,392,330,294,440,392],bass:[73,82,98,73],type:'sawtooth',drum:1},boss1:{bpm:128,lead:[196,262,294,262,220,294,330,262],bass:[65,65,82,73],type:'square',drum:1},boss2:{bpm:150,lead:[220,330,440,330,247,370,494,370],bass:[73,98,82,110],type:'sawtooth',drum:1},boss3:{bpm:158,lead:[165,220,247,294,247,220,330,294],bass:[55,65,73,55],type:'sawtooth',drum:1},fever:{bpm:176,lead:[784,988,1175,1318,1175,988,1397,1568],bass:[196,247,220,294],type:'triangle',drum:1}}[mode]||null;if(!cfg)return;const ms=60000/cfg.bpm/2;this.timer=setInterval(()=>{if(!save.music||!this.ctx)return;const i=this.step%cfg.lead.length;this.tone(cfg.lead[i],.11,cfg.type,.025);if(this.step%2===0)this.tone(cfg.bass[this.step%cfg.bass.length],.16,'triangle',.018);if(this.step%2===0){this.tone(55,.05,'sine',.035);this.noise(.035,.016,.01)}else if(cfg.drum===1)this.noise(.025,.009);this.step++},ms)}stop(){if(this.timer){clearInterval(this.timer);this.timer=null}this.mode=''}} const music=new Music();

/* enemy */
function typeForStage(){const r=Math.random();if(state.stage===1){if(r>.92)return'gold';if(r>.72)return'shield';return'normal'}if(state.stage===2){if(r>.94)return'gold';if(r>.75)return'jump';if(r>.55)return'split';if(r>.30)return'shield';return'lightning'}if(r>.95)return'gold';if(r>.79)return'jump';if(r>.62)return'split';if(r>.45)return'shield';if(r>.2)return'lightning';return'normal'}
function addEnemy(type=typeForStage(),xOverride=null,yOverride=null,mini=false){const area=$('playArea').getBoundingClientRect(),base=mini?48:(type==='lightning'?82:type==='gold'?80:74),el=document.createElement('button');el.className=`enemy ${type==='shield'?'shielded':''} ${type==='jump'?'jump':''} ${mini?'miniEnemy':''}`;const imgType=type==='gold'?'gold':type==='lightning'?'lightning':type==='shield'?'shield':type==='split'?'split':type==='jump'?'jump':'normal';el.innerHTML=`<img src="${AS.enemy[imgType]}">${type==='lightning'?'<i class="badge">2 TAP</i>':type==='shield'?'<i class="badge">SHIELD</i>':type==='split'?'<i class="badge">SPLIT</i>':type==='jump'?'<i class="badge">JUMP</i>':''}`;const e={id:++state.id,type,el,size:base,x:xOverride??rand(10,Math.max(20,area.width-base-10)),y:yOverride??(-base-rand(10,80)),speed:(mini?210:type==='lightning'?225:type==='gold'?170:185)*diff().speed,hp:type==='lightning'?2:type==='shield'?2:1,mini,lastJump:state.elapsed};el.style.width=el.style.height=base+'px';el.style.left=e.x+'px';el.style.top=e.y+'px';el.onclick=ev=>{ev.preventDefault();hitEnemy(e,ev.clientX,ev.clientY)};state.enemies.push(e);$('playArea').appendChild(el)}
function judgment(e){const area=$('playArea').getBoundingClientRect(),center=e.y+e.size/2,perfect=area.height-112,dist=Math.abs(center-perfect);if(dist<42)return{name:'PERFECT!',mult:2,color:'#8ff8ff',p:'perfect'};if(dist<105)return{name:'GOOD!',mult:1.35,color:'#ffd84c',p:'good'};return{name:'OK',mult:1,color:'#fff',p:'ok'}}
function hitEnemy(e,x,y){if(!state.run||state.paused)return;const idx=state.enemies.findIndex(q=>q.id===e.id);if(idx<0)return;if(e.type==='lightning'||e.type==='shield'){e.hp--;music.sfx('tap');if(e.hp>0){e.el.classList.remove('shielded');e.el.querySelector('.badge').textContent='BREAK!';judgeFx('BREAK!',x,y,'#55dfff');return}}
state.enemies.splice(idx,1);e.el.remove();const j=judgment(e);if(j.p==='perfect'){state.perfect++;music.sfx('perfect')}else if(j.p==='good'){state.good++;music.sfx('tap')}else music.sfx('tap');state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);const dmul=state.elapsed<state.doubleUntil?2:1,fever=state.elapsed<state.feverUntil?2:1;let pts=(e.type==='gold'?220:e.type==='lightning'?135:e.type==='shield'?120:e.type==='split'?120:e.type==='jump'?145:95)*j.mult*dmul*fever;state.score+=pts;if(e.type==='gold'){if(state.hearts<3)state.hearts++;state.score+=100}if(e.type==='split'&&!e.mini){addEnemy('normal',e.x-18,e.y,true);addEnemy('normal',e.x+30,e.y,true)}state.mission++;judgeFx(j.name,x,y,j.color);comboRewards();if(state.blastActive&&state.combo>0&&state.combo%15===0)blast();if(state.mission>=ST[state.stage].target&&!state.bossMode)beginBoss();updateHud()}
function judgeFx(t,x,y,c){const r=$('playArea').getBoundingClientRect(),d=document.createElement('div');d.className='judgment';d.textContent=t;d.style.left=`${x-r.left}px`;d.style.top=`${y-r.top}px`;d.style.color=c;$('playArea').appendChild(d);setTimeout(()=>d.remove(),720)}

function skillChoice(){state.paused=true;const keys=Object.keys(SKILLS).sort(()=>Math.random()-.5).slice(0,3);openModal(`<h2>SKILL CHOICE</h2><p>이번 판의 플레이 스타일을 바꿀 스킬 하나를 선택하세요.</p><div class="choiceGrid">${keys.map(k=>`<button class="skillCard" data-skill="${k}"><div class="ico">${SKILLS[k].icon}</div><b>${SKILLS[k].name}</b><span>${SKILLS[k].desc}</span></button>`).join('')}</div>`);$('modal').querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{applySkill(b.dataset.skill);closeModal();state.paused=false})}

function updateBoss(dt){if(!state.boss)return;state.bossMoveT+=dt;const obj=$('bossObj'),layer=$('bossLayer').getBoundingClientRect();if(state.stage===1){obj.style.left=`${50+Math.sin(state.bossMoveT*1.5)*24}%`;state.bossPatternTimer+=dt;if(state.bossPatternTimer>1.8){state.bossPatternTimer=0;state.bossVulnerable=true;setTimeout(()=>{if(state.boss){state.bossVulnerable=false;updateBossHud()}},800);updateBossHud()}}
if(state.stage===2){state.bossPatternTimer+=dt;if(state.seq.length===0&&!state.bossVulnerable&&state.bossPatternTimer>2.1){state.bossPatternTimer=0;obj.style.left=`${rand(25,75)}%`;spawnSequence()}if(state.bossVulnerable&&state.bossPatternTimer>3){state.bossVulnerable=false;state.bossPatternTimer=0;updateBossHud()}}
if(state.stage===3){state.bossPatternTimer+=dt;if(state.finalPhase===1){obj.style.left=`${50+Math.sin(state.bossMoveT*1.7)*25}%`;if(state.bossPatternTimer>1.65){state.bossPatternTimer=0;state.bossVulnerable=true;setTimeout(()=>{if(state.boss&&state.finalPhase===1){state.bossVulnerable=false;updateBossHud()}},700);updateBossHud()}}else if(state.finalPhase===2){obj.style.left=`${50+Math.sin(state.bossMoveT*2.1)*20}%`;if(!state.danger.length&&!state.bossVulnerable&&state.bossPatternTimer>2.4){state.bossPatternTimer=0;spawnDanger()}if(state.bossVulnerable&&state.bossPatternTimer>1.4){state.bossVulnerable=false;state.bossPatternTimer=0;updateBossHud()}}else{obj.style.left=`${50+Math.sin(state.bossMoveT*3.2)*32}%`;if(state.bossPatternTimer>.98){state.bossPatternTimer=0;state.bossVulnerable=true;setTimeout(()=>{if(state.boss&&state.finalPhase===3){state.bossVulnerable=false;updateBossHud()}},650);updateBossHud()}}}}
/* loop */
function spawnLogic(dt){if(state.bossMode)return;state.spawn+=dt;const base={1:.96,2:.82,3:.70}[state.stage]*diff().gap;if(state.spawn>=base){state.spawn=0;addEnemy()}}
function updateEnemies(dt){const area=$('playArea').getBoundingClientRect(),floor=area.height-105,slow=state.elapsed<state.slowUntil?.65:1;for(let i=state.enemies.length-1;i>=0;i--){const e=state.enemies[i];if(e.type==='jump'&&state.elapsed-e.lastJump>.85&&e.y<floor-100){e.x=rand(10,Math.max(20,area.width-e.size-10));e.lastJump=state.elapsed;e.el.style.left=e.x+'px'}e.y+=e.speed*slow*dt;e.el.style.top=e.y+'px';if(e.y>floor)enemyMiss(e)}}
function loop(ts){if(!state.run||state.screen!=='game')return;if(!state.last)state.last=ts;let dt=Math.min(.05,(ts-state.last)/1000);state.last=ts;if(!state.paused){state.elapsed+=dt;if(state.feverUntil&&state.elapsed>=state.feverUntil){state.feverUntil=0;$('fever').classList.remove('on');music.start(state.bossMode?`boss${state.stage}`:`stage${state.stage}`)}spawnLogic(dt);updateEnemies(dt);if(state.bossMode)updateBoss(dt);updateHud()}requestAnimationFrame(loop)}
/* results */
function starFor(n){const t={1:[1300,2100,3100],2:[1800,2900,4200],3:[2600,4200,6200]}[state.stage];return n>=t[2]?3:n>=t[1]?2:n>=t[0]?1:0}
async function finish(clear){if(!state.run)return;state.run=false;music.stop();clearSeq();$('bossLayer').classList.remove('on');$('bossHud').classList.remove('on');const stars=clear?starFor(state.score):0;if(clear){save.best[state.stage]=Math.max(save.best[state.stage]||0,Math.floor(state.score));save.stars[state.stage]=Math.max(save.stars[state.stage]||0,stars);save.unlocked=Math.max(save.unlocked,Math.min(3,state.stage+1));if(state.stage===3)save.allClear=true;music.sfx('clear')}save.total+=Math.floor(state.score);save.history.unshift({stage:state.stage,score:Math.floor(state.score),combo:state.maxCombo,perfect:state.perfect,time:fmt(state.elapsed),clear,date:Date.now()});save.history=save.history.slice(0,25);if(state.daily.check()){save.dailyDone=state.daily.key}persist();$('resultTitle').textContent=clear?(state.stage===3?'FINISH!':'STAGE CLEAR!'):'MISSION FAILED';$('resultSub').textContent=clear?`${ST[state.stage].name} 클리어 · ${'⭐'.repeat(Math.max(stars,1))}`:'하트가 모두 소진되었습니다.';$('resultScore').textContent=Math.floor(state.score).toLocaleString();$('statCombo').textContent=state.maxCombo;$('statPerfect').textContent=state.perfect;$('statGood').textContent=state.good;$('statBossTime').textContent=state.bossStart?`${(state.elapsed-state.bossStart).toFixed(1)}s`:'—';$('next').disabled=!clear||state.stage===3;$('next').style.opacity=$('next').disabled?.45:1;show('result');rankSubmit(Math.floor(state.score))}
async function rankSubmit(score){$('rankBox').textContent='전체 랭킹 확인 중...';try{await fetch(`${API}/score`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'익명',score})});const r=await fetch(`${API}/leaderboard?limit=100`),d=await r.json(),arr=Array.isArray(d)?d:(d.items||[]),higher=arr.filter(x=>(+x.score||0)>score).length,pct=arr.length?Math.max(1,Math.round((higher+1)/arr.length*100)):null;$('rankBox').innerHTML=pct?`🏆 현재 전체 기록 기준 <b>상위 ${pct}%</b> · 다시 도전해 순위를 올려보세요.`:'기록이 저장되었습니다.'}catch{$('rankBox').textContent='기록은 기기에 저장되었습니다.'}}
/* modal/settings */
function openModal(html){state.paused=state.screen==='game';$('modal').innerHTML=html;$('modalBack').classList.add('on')}function closeModal(){$('modalBack').classList.remove('on');$('modal').innerHTML='';if(state.screen==='game'&&state.run)state.paused=false}
function settingsModal(){openModal(`<h2>설정</h2><p>난이도와 사운드를 조절합니다.</p><div class="settingRow"><b>난이도</b><div class="chipRow">${Object.keys(DIFF).map(k=>`<button class="chip ${save.difficulty===k?'on':''}" data-diff="${k}">${DIFF[k].name}</button>`).join('')}</div></div><div class="settingRow"><b>BGM</b><button class="toggle ${save.music?'on':''}" data-tog="music"></button></div><div class="settingRow"><b>효과음</b><button class="toggle ${save.sfx?'on':''}" data-tog="sfx"></button></div><div class="modalActions"><button class="blue" id="closeSet">닫기</button></div>`);$('modal').querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{save.difficulty=b.dataset.diff;persist();settingsModal()});$('modal').querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{save[b.dataset.tog]=!save[b.dataset.tog];persist();if(!save.music)music.stop();else if(state.screen==='game')music.start(state.bossMode?`boss${state.stage}`:`stage${state.stage}`);settingsModal()});$('closeSet').onclick=closeModal}
function pauseModal(){openModal(`<h2>일시정지</h2><p>잠시 멈췄습니다.</p><div class="modalActions"><button class="blue" id="resume">계속하기</button><button class="ghost" id="setFromPause">설정</button></div><div class="modalActions"><button class="ghost" id="restart">다시 시작</button><button class="danger" id="homeFromPause">홈으로</button></div>`);$('resume').onclick=closeModal;$('setFromPause').onclick=settingsModal;$('restart').onclick=()=>{closeModal();startStage(state.stage)};$('homeFromPause').onclick=()=>{state.run=false;closeModal();show('home')}}
function achievements(){const a=[['첫 승리',save.history.some(h=>h.clear)],['50 COMBO',save.history.some(h=>h.combo>=50)],['PERFECT 20',save.history.some(h=>h.perfect>=20)],['STAGE 3 해금',save.unlocked>=3],['손가락 왕국 탈출',save.allClear],['오늘의 왕관',save.dailyDone===state.daily.key]];openModal(`<h2>업적</h2><p>기록을 쌓아 왕관을 모아보세요.</p><div class="scoreRows">${a.map(x=>`<div class="scoreRow"><span>${x[1]?'🏆':'🔒'} ${x[0]}</span><b>${x[1]?'완료':'도전중'}</b></div>`).join('')}</div><div class="modalActions"><button class="blue" id="closeAch">닫기</button></div>`);$('closeAch').onclick=closeModal}
function scores(){openModal(`<h2>점수판</h2><p>이 기기에 저장된 최고 기록입니다.</p><div class="scoreRows">${[1,2,3].map(i=>`<div class="scoreRow"><span>STAGE ${i}</span><b>${(save.best[i]||0).toLocaleString()} · ${'⭐'.repeat(save.stars[i]||0)||'—'}</b></div>`).join('')}</div><div class="modalActions"><button class="blue" id="closeScore">닫기</button></div>`);$('closeScore').onclick=closeModal}
function dailyModal(){openModal(`<h2>오늘의 도전</h2><div class="dailyBox"><b>${state.daily.title}</b><p>${state.daily.desc}</p><strong>${save.dailyDone===state.daily.key?'👑 오늘의 왕관 획득!':'아직 도전 중'}</strong></div><div class="modalActions"><button class="blue" id="closeDaily">닫기</button></div>`);$('closeDaily').onclick=closeModal}
async function share(text='BITTER HERO · TAP! DODGE! FEVER!'){const data={title:'BITTER HERO',text,url:GAME_URL};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(`${text} ${GAME_URL}`);alert('링크가 복사되었습니다.')}}catch(e){}}
/* events */
$('playHot').onclick=()=>{music.unlock();show('lobby')};$('achHot').onclick=achievements;$('scoreHot').onclick=scores;$('settingHot').onclick=settingsModal;$('soundQuick').onclick=()=>{save.music=!save.music;save.sfx=save.music;persist();$('soundQuick').textContent=save.music?'🔊':'🔇';if(!save.music)music.stop()};$('shareQuick').onclick=()=>share();document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{state.run=false;closeModal();show('home')});$('dailyBtn').onclick=dailyModal;$('settingsBtn').onclick=settingsModal;$('pauseBtn').onclick=pauseModal;$('retry').onclick=()=>startStage(state.stage);$('next').onclick=()=>{if(!$('next').disabled)startStage(Math.min(3,state.stage+1))};$('selectStage').onclick=()=>show('lobby');$('books').onclick=()=>window.open(BOOK_URL,'_blank');$('shareResult').onclick=()=>share(`BITTER HERO STAGE ${state.stage} · ${Math.floor(state.score).toLocaleString()}점`);$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};document.body.addEventListener('pointerdown',()=>music.unlock(),{once:true});
renderLobby();
})();
</script></body></html>
